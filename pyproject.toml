[project]
name = "multi-agent-ops-crew"
version = "0.1.0"
description = "Multi-Agent Operations Analysis Platform"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "ddgs>=9.16.0",
    "langchain>=1.3.18",
    "langchain-huggingface>=1.2.2",
    "langgraph>=1.2.11",
    "langsmith>=0.11.2",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "plotly>=7.0.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.45.0",
]

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multi_agent_ops"]

[dependency-groups]
dev = [
    "hatchling>=1.32.0",
]